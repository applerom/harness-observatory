[project]
name = "harness-observatory"
version = "0.1.0"
description = "Local-first observatory for comparing AI coding harnesses."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic==1.18.4",
    "fastapi==0.136.1",
    "jinja2==3.1.6",
    "lxml==6.1.0",
    "python-multipart==0.0.26",
    "sqlmodel==0.0.38",
    "uvicorn==0.46.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/observatory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==1.20.2",
    "pytest==9.0.3",
    "ruff==0.15.12",
]
