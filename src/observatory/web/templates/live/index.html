{% extends "_base.html" %}

{% block title %}Live Agent Studio - Harness Observatory{% endblock %}

{% block content %}
  <section class="space-y-6">
    <div>
      <p class="text-sm font-medium uppercase tracking-normal text-emerald-700">Live Agent Studio</p>
      <h1 class="mt-2 text-3xl font-semibold tracking-normal text-slate-950">Live Agent Studio</h1>
      <p class="mt-3 max-w-3xl text-base leading-7 text-slate-700">
        Dispatch a live discovery AgentJob and stream the runner output to the room.
      </p>
    </div>

    <form class="grid gap-5 rounded-lg border border-slate-200 bg-white p-5 shadow-sm" action="/live" method="post">
      <label class="grid gap-2 text-sm font-medium text-slate-900">
        Harness target
        <select class="rounded-md border border-slate-300 bg-white px-3 py-2 text-slate-900" name="harness_id" required>
          {% for harness in harnesses %}
            <option value="{{ harness.id }}">{{ harness.name }}</option>
          {% endfor %}
        </select>
      </label>

      <label class="grid gap-2 text-sm font-medium text-slate-900">
        Runner
        <select class="rounded-md border border-slate-300 bg-white px-3 py-2 text-slate-900" name="runner_name">
          <option value="codex">CodexRunner</option>
          <option value="claude">ClaudeRunner</option>
        </select>
      </label>

      <label class="grid gap-2 text-sm font-medium text-slate-900">
        Task prompt
        <textarea class="min-h-40 rounded-md border border-slate-300 px-3 py-2 text-slate-900" name="task_prompt" required>Find one fresh implementation or documentation detail in this harness that would make a useful teaching Insight. Include evidence paths and uncertainty.</textarea>
      </label>

      <div>
        <button class="rounded-md bg-slate-950 px-4 py-2 text-sm font-medium text-white hover:bg-slate-800" type="submit">
          Start live job
        </button>
      </div>
    </form>
  </section>
{% endblock %}
