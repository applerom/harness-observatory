# FILE: alembic.ini
# VERSION: 2026-04-30
# START_MODULE_CONTRACT:
# PURPOSE: Alembic configuration for applying the v0.1 SQLite schema migration.
# PRD_REF: docs/PRD.md §26.6
# WHY_REF: docs/why-graph.xml#MOD-MODELS
# SCOPE: migration script location; local SQLite URL; logging
# INVARIANTS:
# - Default migration target is ./data/observatory.sqlite.
# - No application tables are created outside Alembic during migration.
# :END_MODULE_CONTRACT

[alembic]
script_location = migrations
prepend_sys_path = .
sqlalchemy.url = sqlite:///./data/observatory.sqlite

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

